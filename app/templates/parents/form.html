{% extends "base.html" %}
{% block title %}Add Parent{% endblock %}
{% block page_title %}Add Parent / Guardian{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <div class="card-header py-3">Add Parent / Guardian</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold">First Name *</label>
          <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Last Name *</label>
          <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Relationship</label>
          <select name="relationship" class="form-select">
            <option value="parent">Parent</option>
            <option value="guardian">Guardian</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Phone</label>
          <input type="text" name="phone" class="form-control" placeholder="+254...">
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" name="email" class="form-control">
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary text-white">Save</button>
        <a href="{{ url_for('parents.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
