<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SchoolMS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-header { background: linear-gradient(135deg, #8B0000, #c0392b); border-radius: 16px 16px 0 0; padding: 32px; text-align: center; color: white; }
    .btn-login { background: #8B0000; border: none; padding: 12px; font-weight: 600; border-radius: 8px; }
    .btn-login:hover { background: #b30000; }
    .form-control:focus { border-color: #8B0000; box-shadow: 0 0 0 0.2rem rgba(139,0,0,0.15); }
    .demo-badge { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 16px; font-size: 0.8rem; color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card login-card">
        <div class="login-header">
          <div style="font-size:2.5rem;">🏫</div>
          <h4 class="mb-1 fw-bold">SchoolMS</h4>
          <p class="mb-0 opacity-75" style="font-size:0.85rem;">Kitengela International Schools</p>
        </div>
        <div class="card-body p-4">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
          {% endwith %}
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100 text-white">Sign In</button>
          </form>
          <div class="demo-badge mt-3 text-center">
            Demo: <strong>admin</strong> / <strong>admin123</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
