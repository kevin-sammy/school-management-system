{% extends 'base.html' %}{% block page_title %}Transport route{% endblock %}{% block content %}<h2>Transport route</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label d-block">Route name<input class="form-control" name="name" type="text" value="{{ route.name if route else "" }}" required></label><label class="form-label d-block">Vehicle registration<input class="form-control" name="vehicle_registration" type="text" value="{{ route.vehicle_registration if route else "" }}" required></label><label class="form-label d-block">Driver name<input class="form-control" name="driver_name" type="text" value="{{ route.driver_name if route else "" }}" required></label><label class="form-label d-block">Driver phone<input class="form-control" name="driver_phone" type="text" value="{{ route.driver_phone if route else "" }}" ></label><label class="d-block">Assigned teacher<select class="form-select" name="teacher_id" required>{% for teacher in teachers %}<option value="{{ teacher.id }}" {% if route and route.teacher_id==teacher.id %}selected{% endif %}>{{ teacher.full_name }}</option>{% endfor %}</select></label><label>Status<select name="status" class="form-select">{% for status in ['active','inactive'] %}<option {% if route and route.status==status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label class="d-block">Notes<textarea name="notes" class="form-control">{{ route.notes if route else '' }}</textarea></label><button class="btn btn-primary mt-3">Save route</button></form>{% endblock %}
