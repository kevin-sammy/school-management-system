{% extends 'base.html' %}{% block page_title %}Change password{% endblock %}{% block content %}<div class="card p-4" style="max-width:540px"><h2>Change password</h2><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label d-block">Current password<input class="form-control" type="password" name="current_password" autocomplete="current-password" required></label><label class="form-label d-block">New password<input class="form-control" type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label class="form-label d-block">Confirm password<input class="form-control" type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="btn btn-primary">Update password</button></form></div>{% endblock %}
