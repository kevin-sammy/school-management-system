{% extends "base.html" %}
{% block title %}Record Fee{% endblock %}
{% block page_title %}Record Fee Transaction{% endblock %}
{% block content %}
<div class="card" style="max-width:580px;">
  <div class="card-header py-3">Fee Transaction</div>
  <div class="card-body">
    <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label small fw-semibold">Student *</label>
          <select name="student_id" class="form-select" required>
            <option value="">Select student</option>
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.full_name }} ({{ s.class_name }}) — Balance: KES {{ "{:,.0f}".format(s.fee_balance) }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Type *</label>
          <select name="record_type" class="form-select" required>
            <option value="payment">Payment (Money In)</option>
            <option value="invoice">Invoice (Charge)</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Amount (KES) *</label>
          <input type="number" name="amount" class="form-control" step="0.01" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Payment Method</label>
          <select name="payment_method" class="form-select">
            <option value="cash">Cash</option>
            <option value="mpesa">M-Pesa</option>
            <option value="bank">Bank Transfer</option>
            <option value="cheque">Cheque</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold">Reference No</label>
          <input type="text" name="reference_no" class="form-control" placeholder="e.g. M-Pesa code">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Term</label>
          <select name="term" class="form-select">
            <option>Term 1</option><option>Term 2</option><option>Term 3</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Year</label>
          <input type="number" name="year" class="form-control" value="2026">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Date</label>
          <input type="date" name="date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Description</label>
          <input type="text" name="description" class="form-control" placeholder="e.g. Term 1 School Fees">
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary text-white">Save Transaction</button>
        <a href="{{ url_for('fees.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
