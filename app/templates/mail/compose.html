{% extends 'base.html' %}{% block page_title %}Compose message{% endblock %}{% block content %}<h2>Compose message</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Audience<select class="form-select" name="audience"><option value="individual">One person</option>{% if current_user.role=='admin' %}{% for role in ['teachers','students','parents','all'] %}<option value="{{ role }}">{{ role|title }}</option>{% endfor %}{% endif %}</select></label><label class="d-block">Recipient<select class="form-select" name="recipient_id">{% for user in recipients %}<option value="{{ user.id }}">{{ names[user.id] }} · {{ user.role }}</option>{% endfor %}</select></label><label class="form-label d-block">Subject<input class="form-control" name="subject" type="text" value="" required></label><label class="d-block">Message<textarea class="form-control" name="body" maxlength="20000" required></textarea></label><button class="btn btn-primary mt-3">Send to school inbox</button></form>{% endblock %}
