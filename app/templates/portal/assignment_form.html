{% extends 'base.html' %}{% block page_title %}New assignment{% endblock %}{% block content %}<div class="card p-4"><h2>Create assignment</h2><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label d-block">Class and subject<select name="class_id" class="form-select" required>{% for c in classes %}<option value="{{ c.id }}">{{ c.class_name }} {{ c.stream }} · {{ c.subject }}</option>{% endfor %}</select></label><label class="form-label d-block">Title<input class="form-control" name="title" maxlength="120" required></label><label class="form-label d-block">Instructions<textarea class="form-control" name="instructions" rows="8" maxlength="20000" required></textarea></label><label class="form-label d-block">Due date<input class="form-control" type="date" name="due_date" required></label><button class="btn btn-primary" {% if not classes %}disabled{% endif %}>Publish assignment</button> <a href="{{ url_for('portal.home') }}">Cancel</a>{% if not classes %}<p>Ask your administrator to assign a class first.</p>{% endif %}</form></div>{% endblock %}
